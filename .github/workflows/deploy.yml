name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy to Pi
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: sharky
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 900s
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/wirelessfishes/website-backend.git main
            docker compose build
            docker compose up -d

      - name: Notify
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: sharky
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 900s
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            SHORT_SHA=$(git rev-parse --short HEAD)
            AUTHOR="${{ github.actor }}"
            MSG=$(echo "${{ github.event.head_commit.message }}" | head -1)
            if [ "${{ job.status }}" = "success" ]; then
              STATUS="Success"
            else
              STATUS="Failed"
            fi
            curl -s -d "${STATUS} — website-backend
            Commit: ${SHORT_SHA}
            Author: ${AUTHOR}
            Message: ${MSG}" ${{ secrets.BACKEND_NTFY_CHANNEL }}
