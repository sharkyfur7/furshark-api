services:
  api:
    container_name: api
    dns:
      - 1.1.1.1
      - 8.8.8.8
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./backup:/app/backup
    environment:
      - NODE_ENV=production
    env_file:
      - .env
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --url http://localhost:3000
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - api
